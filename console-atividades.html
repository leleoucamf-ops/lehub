<!doctype html>
<!-- LEHUB — CONSOLE DE ATIVIDADES V2 SEM TOPBAR / PUBLICAR COMO console-atividades.html -->
<html lang="pt-BR" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LECAR — CONSOLE DE ATIVIDADES</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --blue-900:#1e3a8a;
      --blue-700:#1d4ed8;
      --blue-600:#2563eb;
      --blue-500:#3b82f6;
      --bg:#e9eef6;
      --panel:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#dbe3ef;
      --terminal:#07111f;
      --terminal-2:#0d1b2e;
      --green:#22c55e;
      --red:#ef4444;
      --amber:#f59e0b;
    }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    body { min-height:100vh; background:linear-gradient(145deg,#dfe8f5,#f8fafc 58%,#e6edf7); color:var(--text); }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    [hidden] { display:none !important; }

    .auth-gate {
      position:fixed; inset:0; z-index:1000; display:grid; place-items:center; padding:20px;
      background:linear-gradient(145deg,#0b1d3a,#173f82 55%,#2563eb);
    }
    .auth-card {
      width:min(420px,100%); padding:26px; border:1px solid rgba(255,255,255,.25); border-radius:22px;
      background:rgba(8,24,53,.82); color:#fff; text-align:center; box-shadow:0 24px 70px rgba(0,0,0,.34); backdrop-filter:blur(18px);
    }
    .auth-card img { width:210px; max-width:75%; margin-bottom:18px; filter:drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
    .auth-card h1 { font-size:1rem; letter-spacing:.04em; }
    .auth-card p { margin-top:10px; color:#cbd5e1; font-size:.72rem; font-weight:700; line-height:1.55; }
    .auth-card button { margin-top:18px; min-height:44px; padding:0 18px; border:0; border-radius:12px; background:#fff; color:#1e3a8a; font-weight:900; }

    .page { min-height:100vh; display:grid; grid-template-rows:auto minmax(0,1fr); }

    .filters {
      padding:12px clamp(12px,2.4vw,28px); display:grid; grid-template-columns:minmax(210px,1.4fr) repeat(2,minmax(160px,.8fr)) minmax(150px,.7fr) auto;
      gap:9px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.94); box-shadow:0 7px 20px rgba(15,23,42,.07);
    }
    .field { display:grid; gap:4px; min-width:0; }
    .field span { color:#475569; font-size:.49rem; font-weight:900; letter-spacing:.05em; text-transform:uppercase; }
    .field input,.field select {
      width:100%; min-height:40px; padding:0 11px; border:1px solid #cbd5e1; border-radius:10px; outline:none; background:#fff; color:#172033;
      font-size:.67rem; font-weight:800;
    }
    .field input:focus,.field select:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.13); }
    .filter-actions { display:flex; align-items:end; gap:7px; }
    .filter-btn { min-height:40px; padding:0 12px; border:0; border-radius:10px; background:#1d4ed8; color:#fff; font-size:.58rem; font-weight:900; text-transform:uppercase; }
    .filter-btn.secondary { border:1px solid #bfdbfe; background:#eff6ff; color:#1d4ed8; }

    .workspace { min-height:0; padding:12px clamp(12px,2.4vw,28px) 22px; display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:10px; }
    .quick-row { display:flex; align-items:center; gap:7px; overflow-x:auto; scrollbar-width:thin; padding-bottom:2px; }
    .quick-btn { flex:0 0 auto; min-height:34px; padding:0 11px; border:1px solid #cbd5e1; border-radius:999px; background:#fff; color:#334155; font-size:.55rem; font-weight:900; text-transform:uppercase; }
    .quick-btn.active { border-color:#2563eb; background:#dbeafe; color:#1d4ed8; }
    .quick-spacer { flex:1 0 12px; }
    .quick-btn.action { border-color:#bfdbfe; background:#eff6ff; color:#1d4ed8; }

    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
    .metric { padding:11px 13px; border:1px solid var(--border); border-radius:14px; background:rgba(255,255,255,.94); box-shadow:0 7px 20px rgba(15,23,42,.05); }
    .metric span { display:block; color:#64748b; font-size:.49rem; font-weight:900; text-transform:uppercase; }
    .metric strong { display:block; margin-top:4px; color:#172554; font-size:1.05rem; font-weight:950; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .metric strong.small { font-size:.7rem; line-height:1.35; }

    .console {
      min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; border:1px solid rgba(71,85,105,.55); border-radius:17px;
      background:linear-gradient(165deg,var(--terminal),var(--terminal-2)); box-shadow:0 20px 50px rgba(15,23,42,.2);
    }
    .console-head { min-height:45px; padding:0 13px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid rgba(148,163,184,.15); background:rgba(15,23,42,.58); }
    .live { display:flex; align-items:center; gap:8px; color:#e2e8f0; font-size:.58rem; font-weight:900; text-transform:uppercase; }
    .dot { width:8px; height:8px; border-radius:50%; background:#94a3b8; box-shadow:0 0 0 4px rgba(148,163,184,.12); }
    .dot.online { background:#4ade80; box-shadow:0 0 10px rgba(74,222,128,.72); }
    .dot.partial { background:#fbbf24; box-shadow:0 0 10px rgba(251,191,36,.62); }
    .dot.offline { background:#fb7185; box-shadow:0 0 10px rgba(251,113,133,.62); }
    .console-context { color:#94a3b8; font-size:.5rem; font-weight:800; text-transform:uppercase; text-align:right; }
    .entries { min-height:0; overflow:auto; padding:8px 0; scrollbar-color:#334155 transparent; }
    .entry { display:grid; grid-template-columns:76px 104px minmax(0,1fr); gap:9px; padding:7px 13px; border-bottom:1px solid rgba(148,163,184,.08); color:#dbeafe; font:700 .66rem/1.45 Consolas,'Courier New',monospace; }
    .entry:hover { background:rgba(59,130,246,.08); }
    .entry-time { color:#64748b; }
    .entry-module { font-weight:950; text-transform:uppercase; }
    .module-lgvc { color:#c084fc; }
    .module-oficina { color:#60a5fa; }
    .module-lava-rapido { color:#22d3ee; }
    .module-polimento { color:#f472b6; }
    .module-acessorios { color:#fbbf24; }
    .module-sistema { color:#94a3b8; }
    .entry-main { min-width:0; overflow-wrap:anywhere; }
    .entry-action { color:#f8fafc; font-weight:950; }
    .entry-meta { color:#94a3b8; }
    .entry-status { color:#86efac; }
    .entry-plate { color:#fef08a; font-weight:950; }
    .entry-source { color:#64748b; font-size:.55rem; }
    .empty { padding:44px 18px; color:#64748b; font-size:.64rem; font-weight:900; text-align:center; text-transform:uppercase; }
    .console-footer { min-height:36px; padding:0 13px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px solid rgba(148,163,184,.14); color:#64748b; font-size:.49rem; font-weight:850; text-transform:uppercase; }

    @media (max-width:980px) {
      .filters { grid-template-columns:1fr 1fr; }
      .filter-actions { align-items:end; }
      .summary { grid-template-columns:1fr 1fr; }
    }
    @media (max-width:620px) {
      .filters { grid-template-columns:1fr; padding:10px; }
      .filter-actions { display:grid; grid-template-columns:1fr 1fr; }
      .summary { grid-template-columns:1fr 1fr; gap:7px; }
      .metric { padding:9px 10px; }
      .entry { grid-template-columns:64px minmax(0,1fr); gap:6px; padding:8px 10px; font-size:.58rem; }
      .entry-module { grid-column:2; grid-row:1; }
      .entry-main { grid-column:1 / -1; grid-row:2; }
      .console-context { display:none; }
      .workspace { padding:9px 9px 15px; }
    }
  </style>
</head>
<body>
  <section id="authGate" class="auth-gate">
    <div class="auth-card">
      <img src="logo.png" alt="LECAR">
      <h1 id="authTitle">VALIDANDO ACESSO</h1>
      <p id="authMessage">AGUARDE A CONFIRMAÇÃO DA SESSÃO DO FIREBASE.</p>
      <button id="authBack" type="button" hidden onclick="voltarAoLPA()">VOLTAR AO LPA</button>
    </div>
  </section>

  <main id="page" class="page" hidden>
    <section class="filters" aria-label="Filtros do console">
      <label class="field"><span>Buscar</span><input id="busca" type="search" placeholder="AÇÃO, USUÁRIO, VEÍCULO OU PLACA" autocomplete="off"></label>
      <label class="field"><span>Início</span><input id="inicio" type="datetime-local"></label>
      <label class="field"><span>Fim</span><input id="fim" type="datetime-local"></label>
      <label class="field"><span>Módulo</span><select id="modulo"><option value="TODOS">TODOS</option><option value="LGVC">LGVC</option><option value="OFICINA">OFICINA</option><option value="LAVA RÁPIDO">LAVA RÁPIDO</option><option value="POLIMENTO">POLIMENTO</option><option value="ACESSÓRIOS">ACESSÓRIOS</option><option value="SISTEMA">SISTEMA</option></select></label>
      <div class="filter-actions"><button class="filter-btn" type="button" onclick="aplicarFiltroPersonalizado()">APLICAR</button><button class="filter-btn secondary" type="button" onclick="definirJanela(60)">ÚLTIMA HORA</button></div>
    </section>

    <section class="workspace">
      <div class="quick-row" aria-label="Janelas rápidas">
        <button class="quick-btn" data-minutos="15" type="button" onclick="definirJanela(15)">15 MIN</button>
        <button class="quick-btn" data-minutos="30" type="button" onclick="definirJanela(30)">30 MIN</button>
        <button class="quick-btn active" data-minutos="60" type="button" onclick="definirJanela(60)">1 HORA</button>
        <button class="quick-btn" data-minutos="120" type="button" onclick="definirJanela(120)">2 HORAS</button>
        <button class="quick-btn" data-minutos="240" type="button" onclick="definirJanela(240)">4 HORAS</button>
        <button class="quick-btn" data-minutos="HOJE" type="button" onclick="definirHoje()">HOJE</button>
        <span class="quick-spacer" aria-hidden="true"></span>
        <button class="quick-btn action" type="button" onclick="atualizarAgora()">ATUALIZAR</button>
        <button class="quick-btn action" type="button" onclick="voltarAoLPA()">VOLTAR</button>
      </div>

      <div class="summary">
        <div class="metric"><span>Atividades</span><strong id="totalAtividades">0</strong></div>
        <div class="metric"><span>Módulos ativos</span><strong id="totalModulos">0</strong></div>
        <div class="metric"><span>Última atividade</span><strong id="ultimaAtividade" class="small">—</strong></div>
        <div class="metric"><span>Sessão</span><strong id="usuarioSessao" class="small">—</strong></div>
      </div>

      <section class="console" aria-label="Atividades do sistema">
        <header class="console-head">
          <div class="live"><i id="statusDot" class="dot"></i><span id="statusTexto">CONECTANDO</span></div>
          <span id="contextoJanela" class="console-context">ÚLTIMA HORA</span>
        </header>
        <div id="lista" class="entries" aria-live="polite"><div class="empty">CARREGANDO ATIVIDADES...</div></div>
        <footer class="console-footer"><span id="fontesStatus">FIREBASE: CONECTANDO</span><span id="relogio">--:--:--</span></footer>
      </section>
    </section>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDjMGX595VvyAj6Nk-I4Pj4VGlipJNovPw",
      authDomain: "lehub-lecar.firebaseapp.com",
      projectId: "lehub-lecar",
      storageBucket: "lehub-lecar.firebasestorage.app",
      messagingSenderId: "338216307290",
      appId: "1:338216307290:web:bb31d3710098866094e663"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const PAGINA_LPA = "./index.html";
    const COLECAO_PERFIS = "usuarios_sistema";
    const EMAIL_ADMIN_RECUPERACAO = "leleoucamf@gmail.com";
    const LIMITE_POR_FONTE = 250;

    const FONTES = Object.freeze([
      {nome:"auditoria_lecar",modulo:"SISTEMA",campoTempo:"criadoEmISO",tipo:"AUDITORIA",prioridade:3},
      {nome:"lgvc_ordens_servico",modulo:"LGVC",campoTempo:"atualizadoEmISO",tipo:"LGVC_ORDEM",prioridade:2},
      {nome:"lgvc_veiculos",modulo:"LGVC",campoTempo:"atualizadoEmISO",tipo:"LGVC_VEICULO",prioridade:2},
      {nome:"servicos_lista_geral",modulo:"OFICINA",campoTempo:"ultimaAtualizacaoISO",tipo:"OPERACIONAL",prioridade:1},
      {nome:"veiculos",modulo:"OFICINA",campoTempo:"ultima_modificacao_iso",tipo:"OPERACIONAL",prioridade:1},
      {nome:"lava_rapido_servicos",modulo:"LAVA RÁPIDO",campoTempo:"atualizadoEmISO",tipo:"OPERACIONAL",prioridade:1},
      {nome:"polimento_servicos",modulo:"POLIMENTO",campoTempo:"atualizadoEmISO",tipo:"OPERACIONAL",prioridade:1},
      {nome:"acessorios_servicos",modulo:"ACESSÓRIOS",campoTempo:"atualizadoEmISO",tipo:"OPERACIONAL",prioridade:1}
    ]);

    let usuarioAtual = null;
    let perfilAtual = null;
    let inicioJanela = new Date(Date.now()-60*60*1000);
    let fimJanela = new Date();
    let janelaRapidaAtual = 60;
    let unsubscribes = [];
    let atividadesPorFonte = new Map();
    let fontesConectadas = new Set();
    let fontesFalha = new Map();
    let estadosDocumentos = new Map();

    function normalizar(valor,limite=220) {
      return String(valor ?? "").trim().replace(/\s+/g," ").toUpperCase().slice(0,limite);
    }

    function semAcentos(valor) {
      return normalizar(valor).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    }

    function escapar(valor) {
      return String(valor ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    function dataValida(valor) {
      if (valor?.toDate) return valor.toDate();
      if (valor instanceof Date) return valor;
      const data = new Date(valor || 0);
      return Number.isFinite(data.getTime()) ? data : null;
    }

    function obterData(dados={},campoPreferencial="") {
      const campos = [campoPreferencial,"criadoEmISO","atualizadoEmISO","ultimaAtualizacaoISO","ultima_modificacao_iso","dataHoraISO","criadoEm","atualizadoEm","ultimaAtualizacao"];
      for (const campo of campos) {
        if (!campo || dados?.[campo] == null || dados?.[campo] === "") continue;
        const data = dataValida(dados[campo]);
        if (data) return data;
      }
      return new Date(0);
    }

    function primeiro(dados={},campos=[]) {
      for (const campo of campos) {
        const valor = dados?.[campo];
        if (valor !== undefined && valor !== null && String(valor).trim() !== "") return valor;
      }
      return "";
    }

    function moduloCanonico(valor,fallback="SISTEMA") {
      const chave = semAcentos(valor || fallback).replaceAll("_"," ");
      if (chave.includes("LGVC")) return "LGVC";
      if (chave.includes("LAVA")) return "LAVA RÁPIDO";
      if (chave.includes("POLIMENTO")) return "POLIMENTO";
      if (chave.includes("ACESS")) return "ACESSÓRIOS";
      if (chave.includes("OFICINA") || chave.includes("MECAN")) return "OFICINA";
      return "SISTEMA";
    }

    function statusDocumento(dados={}) {
      return normalizar(primeiro(dados,["statusNovo","status","statusServico","statusDistribuicao","situacao","estado"]),60);
    }

    function responsavelDocumento(dados={}) {
      return normalizar(primeiro(dados,["profissional","mecanicoResponsavel","mecanico_responsavel","instalador","polidorResponsavel","polidor_responsavel","lavadorResponsavel","lavador_responsavel","responsavel"]),50);
    }

    function usuarioDocumento(dados={}) {
      return normalizar(primeiro(dados,["usuario","atualizadoPor","criadoPor","alteradoPor","excluidoPor"]),50);
    }

    function acaoOperacional(dados={},anterior=null,tipo="OPERACIONAL") {
      if (tipo === "LGVC_ORDEM") {
        const status = statusDocumento(dados) || "ATUALIZADA";
        return anterior ? `ATUALIZOU ORDEM • ${status}` : `ORDEM ${status}`;
      }
      if (tipo === "LGVC_VEICULO") return anterior ? "ATUALIZOU VEÍCULO LGVC" : "VEÍCULO LGVC ATUALIZADO";
      const statusAtual = statusDocumento(dados);
      const statusAntes = anterior ? statusDocumento(anterior) : "";
      const respAtual = responsavelDocumento(dados);
      const respAntes = anterior ? responsavelDocumento(anterior) : "";
      if (anterior && respAtual !== respAntes) return respAtual ? "ATRIBUIU RESPONSÁVEL" : "REMOVEU RESPONSÁVEL";
      if (anterior && statusAtual && statusAntes && statusAtual !== statusAntes) {
        if (semAcentos(statusAtual).includes("FINAL")) return "FINALIZOU";
        return "ALTEROU STATUS";
      }
      if (!anterior && semAcentos(statusAtual).includes("FINAL")) return "FINALIZADO";
      return anterior ? "ATUALIZOU" : "ATUALIZAÇÃO REGISTRADA";
    }

    function converterAuditoria(docId,dados,fonte) {
      const detalhes = dados?.detalhes && typeof dados.detalhes === "object" ? dados.detalhes : {};
      const internos = dados?.dados && typeof dados.dados === "object" ? dados.dados : {};
      const depois = dados?.depois && typeof dados.depois === "object" ? dados.depois : {};
      const unido = {...internos,...detalhes,...depois,...dados};
      const tipo = normalizar(dados.tipo,70);
      let acao = normalizar(dados.acao,90);
      if (!acao) {
        if (tipo === "CADASTRO_GERAL_LGVC") acao = "CADASTROU ORDEM GERAL";
        else if (tipo.includes("EXCLUIDO")) acao = "MOVEU PARA LIXEIRA";
        else if (tipo.includes("RESTAUR")) acao = "RESTAUROU";
        else acao = tipo.replaceAll("_"," ") || "ATUALIZAÇÃO DE SISTEMA";
      }
      const setores = Array.isArray(dados.setores) ? dados.setores.join(", ") : "";
      return {
        id:`${fonte.nome}:${docId}`,
        fonte:fonte.nome,
        prioridade:fonte.prioridade,
        data:obterData(dados,fonte.campoTempo),
        modulo:moduloCanonico(dados.modulo || (tipo.includes("LGVC") ? "LGVC" : fonte.modulo)),
        acao,
        usuario:usuarioDocumento(unido),
        profissional:responsavelDocumento(unido),
        veiculo:normalizar(primeiro(unido,["veiculo","modelo","nomeVeiculo"]),80),
        placa:normalizar(primeiro(unido,["placa","placaVeiculo","veiculoId"]),16).replace(/[^A-Z0-9]/g,""),
        statusAnterior:normalizar(primeiro(unido,["statusAnterior","situacaoAnterior","statusAntes"]),60),
        statusNovo:normalizar(primeiro(unido,["statusNovo","status","statusServico","situacaoNova"]),60),
        detalhe:normalizar(primeiro(unido,["detalhe","descricao","observacoes"]) || (setores ? `SETORES: ${setores}` : ""),220)
      };
    }

    function converterOperacional(docId,dados,fonte,anterior=null) {
      const modulo = moduloCanonico(dados.modulo || fonte.modulo,fonte.modulo);
      const statusAnterior = anterior ? statusDocumento(anterior) : "";
      const statusNovo = statusDocumento(dados);
      const setores = Array.isArray(dados.setores) ? dados.setores.join(", ") : "";
      return {
        id:`${fonte.nome}:${docId}`,
        fonte:fonte.nome,
        prioridade:fonte.prioridade,
        data:obterData(dados,fonte.campoTempo),
        modulo,
        acao:acaoOperacional(dados,anterior,fonte.tipo),
        usuario:usuarioDocumento(dados),
        profissional:responsavelDocumento(dados),
        veiculo:normalizar(primeiro(dados,["veiculo","modelo","nomeVeiculo"]),80),
        placa:normalizar(primeiro(dados,["placa","placaVeiculo","veiculoId"]),16).replace(/[^A-Z0-9]/g,""),
        statusAnterior,
        statusNovo,
        detalhe:normalizar(primeiro(dados,["descricao","observacoes","motivoRetorno"]) || (setores ? `SETORES: ${setores}` : ""),220)
      };
    }

    function atividadeEquivalente(a,b) {
      if (a.modulo !== b.modulo) return false;
      if (a.placa && b.placa && a.placa !== b.placa) return false;
      if (Math.abs(a.data.getTime()-b.data.getTime()) > 15000) return false;
      const aa = semAcentos(a.acao);
      const ab = semAcentos(b.acao);
      return aa === ab || aa.includes(ab) || ab.includes(aa) || (aa.includes("ATUALIZ") && ab.includes("ATUALIZ"));
    }

    function todasAtividades() {
      const lista = [...atividadesPorFonte.values()].flat();
      const ordenada = lista
        .filter(item => item.data >= inicioJanela && item.data <= fimJanela)
        .sort((a,b) => b.data-a.data || b.prioridade-a.prioridade);
      const finais = [];
      for (const item of ordenada) {
        const equivalente = finais.find(existente => atividadeEquivalente(existente,item));
        if (!equivalente) finais.push(item);
        else if (item.prioridade > equivalente.prioridade) finais[finais.indexOf(equivalente)] = item;
      }
      return finais.sort((a,b) => b.data-a.data);
    }

    function classeModulo(modulo) {
      return `module-${semAcentos(modulo).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}`;
    }

    function formatarDataHora(data) {
      return data.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
    }

    function renderizar() {
      const busca = semAcentos(document.getElementById("busca").value);
      const modulo = document.getElementById("modulo").value;
      const atividades = todasAtividades().filter(item => {
        if (modulo !== "TODOS" && item.modulo !== modulo) return false;
        if (!busca) return true;
        return semAcentos([item.modulo,item.acao,item.usuario,item.profissional,item.veiculo,item.placa,item.statusAnterior,item.statusNovo,item.detalhe,item.fonte].join(" ")).includes(busca);
      });

      const lista = document.getElementById("lista");
      if (!atividades.length) {
        lista.innerHTML = '<div class="empty">NENHUMA ATIVIDADE ENCONTRADA NESTE PERÍODO.</div>';
      } else {
        lista.innerHTML = atividades.map(item => {
          const segmentos = [];
          if (item.usuario) segmentos.push(`USUÁRIO: ${escapar(item.usuario)}`);
          if (item.profissional) segmentos.push(`RESPONSÁVEL: ${escapar(item.profissional)}`);
          if (item.veiculo) segmentos.push(escapar(item.veiculo));
          if (item.placa) segmentos.push(`<span class="entry-plate">${escapar(item.placa)}</span>`);
          if (item.statusAnterior || item.statusNovo) segmentos.push(`<span class="entry-status">${escapar(item.statusAnterior || "—")} → ${escapar(item.statusNovo || "—")}</span>`);
          if (item.detalhe) segmentos.push(escapar(item.detalhe));
          return `<article class="entry"><time class="entry-time">${escapar(formatarDataHora(item.data))}</time><span class="entry-module ${classeModulo(item.modulo)}">${escapar(item.modulo)}</span><div class="entry-main"><span class="entry-action">${escapar(item.acao)}</span>${segmentos.length ? ` <span class="entry-meta">• ${segmentos.join(" • ")}</span>` : ""} <span class="entry-source">[${escapar(item.fonte)}]</span></div></article>`;
        }).join("");
      }

      document.getElementById("totalAtividades").textContent = String(atividades.length);
      document.getElementById("totalModulos").textContent = String(new Set(atividades.map(item => item.modulo)).size);
      document.getElementById("ultimaAtividade").textContent = atividades[0] ? formatarDataHora(atividades[0].data) : "—";
      atualizarStatusConexao();
    }

    function atualizarStatusConexao() {
      const total = FONTES.length;
      const conectadas = fontesConectadas.size;
      const falhas = fontesFalha.size;
      const dot = document.getElementById("statusDot");
      const texto = document.getElementById("statusTexto");
      const fontes = document.getElementById("fontesStatus");
      dot.className = "dot";
      if (!navigator.onLine || conectadas === 0 && falhas === total) {
        dot.classList.add("offline"); texto.textContent = "SEM CONEXÃO";
      } else if (falhas > 0) {
        dot.classList.add("partial"); texto.textContent = "CONEXÃO PARCIAL";
      } else if (conectadas === total) {
        dot.classList.add("online"); texto.textContent = "TEMPO REAL ATIVO";
      } else {
        texto.textContent = "CONECTANDO";
      }
      fontes.textContent = `FONTES: ${conectadas}/${total}${falhas ? ` • FALHAS: ${falhas}` : ""}`;
    }

    function encerrarListeners() {
      unsubscribes.forEach(unsubscribe => { try { unsubscribe?.(); } catch (_) {} });
      unsubscribes = [];
      fontesConectadas.clear();
      fontesFalha.clear();
      estadosDocumentos.clear();
    }

    function consultaFonte(fonte) {
      let consulta = db.collection(fonte.nome)
        .where(fonte.campoTempo,">=",inicioJanela.toISOString());
      if (janelaRapidaAtual === "PERSONALIZADO") {
        consulta = consulta.where(fonte.campoTempo,"<=",fimJanela.toISOString());
      }
      return consulta.orderBy(fonte.campoTempo,"desc").limit(LIMITE_POR_FONTE);
    }

    function iniciarFonte(fonte) {
      const estado = new Map();
      estadosDocumentos.set(fonte.nome,estado);
      const unsubscribe = consultaFonte(fonte).onSnapshot(snapshot => {
        fontesConectadas.add(fonte.nome);
        fontesFalha.delete(fonte.nome);
        const primeiraCarga = estado.size === 0;
        const listaAtual = [];
        snapshot.docs.forEach(doc => {
          const dados = doc.data() || {};
          const anterior = estado.get(doc.id) || null;
          const atividade = fonte.tipo === "AUDITORIA"
            ? converterAuditoria(doc.id,dados,fonte)
            : converterOperacional(doc.id,dados,fonte,primeiraCarga ? null : anterior);
          listaAtual.push(atividade);
          estado.set(doc.id,dados);
        });
        atividadesPorFonte.set(fonte.nome,listaAtual);
        renderizar();
      },erro => {
        fontesConectadas.delete(fonte.nome);
        fontesFalha.set(fonte.nome,String(erro?.code || erro?.message || erro));
        atividadesPorFonte.set(fonte.nome,[]);
        console.warn(`[CONSOLE] Fonte ${fonte.nome} indisponível:`,erro?.code || erro);
        renderizar();
      });
      unsubscribes.push(unsubscribe);
    }

    function iniciarTempoReal() {
      encerrarListeners();
      atividadesPorFonte = new Map();
      document.getElementById("lista").innerHTML = '<div class="empty">CARREGANDO ATIVIDADES...</div>';
      FONTES.forEach(iniciarFonte);
      atualizarStatusConexao();
    }

    function paraInputData(data) {
      const local = new Date(data.getTime()-data.getTimezoneOffset()*60000);
      return local.toISOString().slice(0,16);
    }

    function atualizarCamposPeriodo() {
      document.getElementById("inicio").value = paraInputData(inicioJanela);
      document.getElementById("fim").value = paraInputData(fimJanela);
      document.getElementById("contextoJanela").textContent = `${formatarDataHora(inicioJanela)} → ${formatarDataHora(fimJanela)}`;
      document.querySelectorAll(".quick-btn").forEach(btn => btn.classList.toggle("active",String(btn.dataset.minutos) === String(janelaRapidaAtual)));
    }

    window.definirJanela = function(minutos) {
      const valor = Math.max(1,Number(minutos || 60));
      fimJanela = new Date();
      inicioJanela = new Date(fimJanela.getTime()-valor*60000);
      janelaRapidaAtual = valor;
      atualizarCamposPeriodo();
      iniciarTempoReal();
    };

    window.definirHoje = function() {
      const agora = new Date();
      inicioJanela = new Date(agora.getFullYear(),agora.getMonth(),agora.getDate(),0,0,0,0);
      fimJanela = agora;
      janelaRapidaAtual = "HOJE";
      atualizarCamposPeriodo();
      iniciarTempoReal();
    };

    window.aplicarFiltroPersonalizado = function() {
      const inicio = dataValida(document.getElementById("inicio").value);
      const fim = dataValida(document.getElementById("fim").value);
      if (!inicio || !fim || inicio >= fim) {
        alert("INFORME UM PERÍODO VÁLIDO.");
        return;
      }
      inicioJanela = inicio;
      fimJanela = fim;
      janelaRapidaAtual = "PERSONALIZADO";
      atualizarCamposPeriodo();
      iniciarTempoReal();
    };

    function atualizarJanelaMovel() {
      if (janelaRapidaAtual === "PERSONALIZADO") return;
      const agora = new Date();
      fimJanela = agora;
      if (janelaRapidaAtual === "HOJE") {
        inicioJanela = new Date(agora.getFullYear(),agora.getMonth(),agora.getDate(),0,0,0,0);
      } else {
        inicioJanela = new Date(agora.getTime()-Number(janelaRapidaAtual || 60)*60000);
      }
      atualizarCamposPeriodo();
      renderizar();
    }

    window.atualizarAgora = function() {
      if (janelaRapidaAtual !== "PERSONALIZADO" && janelaRapidaAtual !== "HOJE") {
        definirJanela(Number(janelaRapidaAtual || 60));
      } else if (janelaRapidaAtual === "HOJE") {
        definirHoje();
      } else {
        iniciarTempoReal();
      }
    };

    window.voltarAoLPA = function() {
      window.location.href = PAGINA_LPA;
    };

    function negarAcesso(mensagem) {
      encerrarListeners();
      document.getElementById("page").hidden = true;
      document.getElementById("authGate").hidden = false;
      document.getElementById("authTitle").textContent = "ACESSO BLOQUEADO";
      document.getElementById("authMessage").textContent = mensagem;
      document.getElementById("authBack").hidden = false;
    }

    function ehAdministrador(perfil,user) {
      if (String(user?.email || "").toLowerCase() === EMAIL_ADMIN_RECUPERACAO) return true;
      return perfil?.ativo !== false && (
        normalizar(perfil?.perfil,30) === "ADMINISTRADOR" ||
        perfil?.permissoes?.gerenciarUsuarios === true ||
        perfil?.permissoes?.acessarPainelAdministrativo === true
      );
    }

    async function carregarPerfil(user) {
      const doc = await db.collection(COLECAO_PERFIS).doc(user.uid).get();
      return doc.exists ? {uid:user.uid,email:user.email || "",...doc.data()} : null;
    }

    auth.onAuthStateChanged(async user => {
      if (!user) {
        negarAcesso("É NECESSÁRIO ENTRAR NO LPA ANTES DE ABRIR ESTA PÁGINA.");
        return;
      }
      try {
        const perfil = await carregarPerfil(user);
        if (!ehAdministrador(perfil,user)) {
          negarAcesso("ESTA PÁGINA É RESTRITA A USUÁRIOS ADMINISTRADORES AUTENTICADOS.");
          return;
        }
        usuarioAtual = user;
        perfilAtual = perfil || {nome:"LEANDRO",usuario:"LEANDRO",perfil:"ADMINISTRADOR",ativo:true};
        document.getElementById("usuarioSessao").textContent = normalizar(perfilAtual.nome || perfilAtual.usuario || user.email,60);
        document.getElementById("authGate").hidden = true;
        document.getElementById("page").hidden = false;
        definirJanela(60);
      } catch (erro) {
        console.error("Falha ao validar perfil:",erro);
        negarAcesso("NÃO FOI POSSÍVEL VALIDAR O PERFIL NO FIREBASE.");
      }
    });

    document.getElementById("busca").addEventListener("input",renderizar);
    document.getElementById("modulo").addEventListener("change",renderizar);
    window.addEventListener("online",atualizarAgora);
    window.addEventListener("offline",atualizarStatusConexao);
    window.addEventListener("pagehide",encerrarListeners);
    setInterval(() => {
      document.getElementById("relogio").textContent = new Date().toLocaleTimeString("pt-BR",{hour12:false});
    },1000);
    setInterval(atualizarJanelaMovel,30000);
  </script>
</body>
</html>
